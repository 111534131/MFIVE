<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員管理 - MFIVE 賞車網</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .users-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #dc0000;
        }

        .users-table {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .users-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            background: #f5f5f5;
            padding: 1rem;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
        }

        .users-table td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .role-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .role-admin {
            background: #dc0000;
            color: white;
        }

        .role-user {
            background: #4CAF50;
            color: white;
        }

        .btn-delete-user {
            background: #f44336;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-delete-user:hover {
            background: #da190b;
        }

        .btn-delete-user:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <nav>
        <div class="container">
            <div class="logo">MFIVE 賞車網 - 會員管理</div>
            <div id="nav-links">
                <a href="index.html">回到首頁</a>
                <a href="admin.html">管理後台</a>
                <a href="#" onclick="logout()">登出</a>
            </div>
        </div>
    </nav>

    <div class="users-container">
        <div class="users-header">
            <h1>會員管理</h1>
        </div>

        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>使用者名稱</th>
                        <th>電子郵件</th>
                        <th>角色</th>
                        <th>註冊時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                    <!-- 會員列表將在這裡動態載入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/users.js"></script>
</body>

</html>
