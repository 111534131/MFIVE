<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊 - MFIVE 賞車網</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">MFIVE 賞車網</a>
            <nav>
                <a href="index.html">首頁</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>免費註冊會員</h2>
            <form onsubmit="register(event)">
                <div class="form-group">
                    <label for="username">使用者名稱</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">電子信箱</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group" style="display: flex; justify-content: center; margin: 1rem 0;">
                    <div class="g-recaptcha" data-sitekey="6LeYEDMsAAAAADsDAfO173R_5CwIi_o6b8in8UJx"></div>
                </div>
                <button type="submit" class="btn" style="width: 100%">立即註冊</button>
            </form>
            <div class="form-footer">
                已經有帳號了？ <a href="login.html">立即登入</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
